[package]
name = "coorworker-cua"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cua computer-use worker for rust-envd's cua extension"

# The standalone worker enables the desktop stack by default. The envd daemon
# opts into this library only for its cua-desktop distribution; base/static
# daemon builds keep the desktop stack out of their activated dependency graph.
[lib]
name = "coorworker_cua"
path = "src/lib.rs"

[[bin]]
name = "coorworker-cua"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "wayland_windows"
path = "tests/wayland_windows.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:platform-linux", "dep:platform-windows"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["http1"] }
cua-driver-core = { path = "../vendor/cua-driver/rust/crates/cua-driver-core" }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { path = "../vendor/cua-driver/rust/crates/platform-linux", optional = true }

[target.'cfg(windows)'.dependencies]
platform-windows = { path = "../vendor/cua-driver/rust/crates/platform-windows", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
