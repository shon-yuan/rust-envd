name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [base, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install build and dependency-check tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler ripgrep
      - name: Install desktop headers
        if: matrix.profile == 'desktop'
        run: |
          sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libxfixes-dev libxrandr-dev \
            libxcomposite-dev libxrender-dev libxext-dev libxdamage-dev libxkbcommon-dev
      - name: Build, test and lint selected daemon profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          features=()
          if [ "$PROFILE" = base ]; then features=(--no-default-features); fi
          cargo build --locked -j4 "${features[@]}"
          cargo test --locked -j4 "${features[@]}"
          cargo clippy --locked -j4 --all-targets "${features[@]}" -- -D warnings
          cargo fmt --check
      - name: Base dependency graph excludes desktop
        if: matrix.profile == 'base'
        run: |
          cargo tree --locked --no-default-features -e normal --prefix none > /tmp/base-dependencies
          if rg '^(coorworker-cua|cua-driver-core|platform-linux|platform-windows|x11|atspi|rquickjs) ' /tmp/base-dependencies; then exit 1; fi
      - name: Default dependency graph includes embedded desktop
        if: matrix.profile == 'desktop'
        run: |
          cargo tree --locked -e normal --prefix none > /tmp/default-dependencies
          rg '^cua-driver-core ' /tmp/default-dependencies
          rg '^platform-linux ' /tmp/default-dependencies
          if rg '^coorworker-cua ' /tmp/default-dependencies; then exit 1; fi
      - name: Fetch root graph and verify distribution notices
        if: matrix.profile == 'desktop'
        run: |
          cargo fetch --locked
          python3 -I -B scripts/test_distribution.py
          python3 -I -B scripts/generate_notices.py --check

  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools
      - run: cargo build --locked -j4 --no-default-features --release --target x86_64-unknown-linux-musl
      - name: Verify static base executable
        run: |
          file target/x86_64-unknown-linux-musl/release/coorworker-envd
          if readelf -l target/x86_64-unknown-linux-musl/release/coorworker-envd | grep -q INTERP; then exit 1; fi

  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check Windows base daemon
        run: cargo check --locked -j4 --no-default-features --target x86_64-pc-windows-msvc --lib --bins
      - name: Build shared crate for Windows
        run: cargo build --locked -j4 --no-default-features --target x86_64-pc-windows-msvc --lib

  windows-test:
    runs-on: windows-latest
    strategy:
      matrix:
        profile: [base, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: choco install protoc -y --no-progress
      - name: Test Windows base contracts
        if: matrix.profile == 'base'
        run: cargo test --locked -j4 --no-default-features --lib --test cua_native
      - name: Build and test Windows desktop contracts
        if: matrix.profile == 'desktop'
        run: |
          cargo build --locked -j4
          cargo test --locked -j4 --lib --test cua_native --test cua_wayland --test cua_completion
