[package]
name = "coorworker-envd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["http2"] }
tower = { version = "0.5", features = ["util"] }
nix = { version = "0.29", features = ["user", "fs", "signal", "process", "term", "time"] }
xattr = "1"
inotify = { version = "=0.11.5", default-features = false }
thiserror = "2"
tokio = { workspace = true, features = ["sync", "fs"] }
futures-util = "0.3"
flate2 = "1"
http-range = "0.1"
httpdate = "1"
mime_guess = "2"
form_urlencoded = "1"
percent-encoding = "2"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
multer = "3"
tokio-util = { version = "0.7", features = ["io-util"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["alloc"] }
seckey = "=0.12.1"
region = "=4.0.1"
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server", "axum"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "=0.8.5"
url = "=2.5.8"

[build-dependencies]
connectrpc-build = "=0.9.0"

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
http = "1"
tokio = { workspace = true, features = ["sync", "test-util"] }

[features]
client = ["connectrpc/client"]
