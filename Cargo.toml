[package]
name = "coorworker-envd"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["http2"] }
tower = { version = "0.5", features = ["util"] }
nix = { version = "0.29", features = ["user", "fs", "signal", "process", "term", "time"] }
xattr = "1"
inotify = { version = "=0.11.5", default-features = false }
# nfs_mount_linux.go: umount2 and the statx(STATX_MNT_ID) mount-ID probe. The
# version is pinned to the one already in Cargo.lock (transitive of nix).
libc = "0.2.190"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util", "sync", "fs"] }
futures-util = "0.3"
flate2 = "1"
http-range = "0.1"
httpdate = "1"
mime_guess = "2"
form_urlencoded = "1"
percent-encoding = "2"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
multer = "3"
tokio-util = { version = "0.7", features = ["io-util"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["alloc"] }
seckey = "=0.12.1"
region = "=4.0.1"
buffa = { version = "=0.9.1", features = ["json"] }
buffa-descriptor = { version = "=0.9.1", features = ["reflect"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server", "axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "=0.8.5"
url = "=2.5.8"

[build-dependencies]
connectrpc-build = "=0.9.0"

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
http = "1"
tokio = { version = "1", features = ["sync", "test-util"] }

[features]
client = ["connectrpc/client"]

# In-tree fork of connectrpc 0.9.1 (Apache-2.0; see vendor/connectrpc/PATCHES.md)
# carrying the connect-go error-text parity required by the pinned oracle.
[patch.crates-io]
connectrpc = { path = "vendor/connectrpc" }
